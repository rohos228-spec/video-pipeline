name: tests

# Без секретов, без сети к платным провайдерам. Тесты с маркерами live/paid здесь НЕ запускаются никогда.
# Порядок: один процесс pytest на задачу (память).

on:
  push:
    branches: [feature/orchestrator-observe-v1, main]
  pull_request:
  schedule:
    # ночью: legacy-набор целиком (долго), чтобы красные тесты вне быстрых наборов не копились незамеченными
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      legacy:
        description: "Запустить legacy-набор по частям (долго)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # Q-15: пропуск из-за отсутствия ffmpeg в CI считается ошибкой (ffmpeg ставится шагом ниже), а не тихим «зелёным»
  VP_STRICT_SKIPS: "1"

jobs:
  orchestrator:
    name: Orchestrator suite (scripts/run_orchestrator_tests.py)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run suite
        run: >
          python scripts/run_orchestrator_tests.py
          --junitxml=reports/orchestrator.xml
          -m "not live and not paid"
          -p no:warnings
      - name: Docs drift and live-runs registry
        run: >
          python -m pytest -q -p no:cacheprovider -p no:warnings
          tests/test_testing_doc_drift.py tests/test_live_runs_registry.py
          --junitxml=reports/docs.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-orchestrator
          path: reports/*.xml

  # Число чанков считаем из реестра тестов, чтобы при добавлении файлов ни один чанк не потерялся.
  observe_plan:
    name: Plan observe chunks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        run: |
          n=$(python -c "import sys, math; sys.path.insert(0, 'scripts'); from test_suites import observe_files; print(math.ceil(len(observe_files()) / 12))")
          echo "total=$n" >> "$GITHUB_OUTPUT"
          echo "chunks=[$(seq -s, 1 "$n")]" >> "$GITHUB_OUTPUT"

  # Чанки Observe идут параллельно (один процесс pytest на задачу — память).
  # На зелёной гонке #40 самый долгий чанк ~12 минут, поэтому общий PR ~13 вместо ~32 минут.
  observe_chunk:
    name: Observe chunk ${{ matrix.chunk }} / ${{ needs.observe_plan.outputs.total }}
    needs: observe_plan
    strategy:
      # один красный чанк не отменяет остальные — все доложат junit-артефакты
      fail-fast: false
      max-parallel: 10
      matrix:
        chunk: ${{ fromJson(needs.observe_plan.outputs.chunks) }}
    runs-on: ubuntu-latest
    # per-chunk-timeout 40 минут плюс установка окружения
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run chunk ${{ matrix.chunk }}, one pytest process
        run: python scripts/run_legacy_chunked.py --suite observe --chunk 12 --only-chunk ${{ matrix.chunk }} --per-chunk-timeout 2400 --junit-dir reports/observe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-observe-${{ matrix.chunk }}
          path: reports/observe/*.xml

  # Стабильное имя проверки: branch protection ждёт именно этот джоб, а не имена чанков.
  observe:
    name: Observe suite (chunks parallel)
    needs: observe_chunk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All chunks green
        run: |
          result="${{ needs.observe_chunk.result }}"
          if [ "$result" != "success" ]; then
            echo "Observe chunks finished with result: $result"
            exit 1
          fi
          echo "Все чанки Observe зелёные."

  docker:
    name: Docker-only tests (4 modules in tests/observe_v1)
    runs-on: ubuntu-latest
    # Контейнерная задача: внутри есть /.dockerenv, которого требуют эти модули.
    container: python:3.12-bookworm
    timeout-minutes: 30
    env:
      VP_RUN_DOCKER_ONLY: "1"
      PYTHONPATH: tests:tests/observe_v1
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Provide gateway source where test_gateway_route_policy expects it
        run: |
          test -f scripts/diagnostics/gateway.py || { echo "нет scripts/diagnostics/gateway.py"; exit 1; }
          mkdir -p /test-source
          cp scripts/diagnostics/gateway.py /test-source/gateway.py
          cmp scripts/diagnostics/gateway.py /test-source/gateway.py
          # test_decision_tool_cycle_gateway_ack ждёт исходники пилота в /observe-source
          mkdir -p /observe-source/scripts /observe-source/config
          cp -r scripts/diagnostics /observe-source/scripts/diagnostics
          cp scripts/diagnostics/gateway.py /observe-source/gateway.py
          cp config/decision-tool-cycle.example.json /observe-source/config/
      - name: Run docker-only tests
        run: >
          python -m pytest -q -p no:cacheprovider -p no:warnings
          tests/observe_v1/test_decision_tool_cycle_gateway_ack.py
          tests/observe_v1/test_gateway_route_policy.py
          tests/observe_v1/test_hitl_project_authority.py
          tests/observe_v1/test_managed_restart_safety.py
          --junitxml=reports/docker.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-docker
          path: reports/docker.xml

  legacy:
    name: Legacy suite in chunks (nightly or manual)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run chunks, one pytest process at a time
        run: python scripts/run_legacy_chunked.py --suite legacy --chunk 40 --junit-dir reports/legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-legacy
          path: reports/legacy/*.xml
